name: Build ESP32-S3 Headless Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
      - uses: actions/checkout@v4

      - name: Build displayless ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp32-csi-node
          cp sdkconfig.defaults.4mb sdkconfig.defaults
          idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.devkitc" set-target esp32s3
          idf.py -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.devkitc" build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-headless-firmware
          path: firmware/esp32-csi-node/build/esp32-csi-node.bin
          if-no-files-found: error
          
